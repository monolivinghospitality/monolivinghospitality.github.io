<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mono Living Hospitality</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Main Style -->
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <!-- =========================
       BANNER
  ========================== -->
  <div id="banner" style="
    height: 30vh;
    background-size: cover;
    background-position: center;
  "></div>

  <!-- =========================
       CONTENT
  ========================== -->
  <main style="
    max-width: 420px;
    margin: -80px auto 0;
    padding: 0 20px;
    text-align: center;
  ">

    <!-- LOGO -->
    <img id="logo" alt="Villa Logo" style="
      width: 120px;
      height: auto;
      margin-bottom: 24px;
    " />

    <!-- VILLA NAME -->
    <h1 id="villa-name" style="
      font-family: 'glamourluxury', serif;
      font-weight: normal;
      margin-bottom: 8px;
    ">
      Villa Name
    </h1>

    <!-- SUBTITLE -->
    <p id="subtitle" style="
      color: var(--accent-muted);
      margin-bottom: 32px;
    ">
      Subtitle here
    </p>

    <!-- BUTTONS -->
    <div id="buttons"></div>
    <!-- MANAGED BY -->
    <p style="
      margin-top: 32px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--accent-muted);
    ">
      MANAGED BY
    </p>
    
    <p style="
      font-family: 'glamourluxury', serif;
      font-size: 14px;
      margin-bottom: 32px;
    ">
      Mono Living Hospitality
    </p>

    
  </main>

  <!-- SCRIPT -->
  <script src="../script.js"></script>
<footer style="
  text-align: center;
  font-size: 11px;
  opacity: 0.6;
  padding: 24px 0;
">
  © <span id="year"></span> Mono Living Hospitality
</footer>

</body>
</html>
